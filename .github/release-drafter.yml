name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
filter-by-commitish: true
change-template: "* $TITLE by @$AUTHOR in [#$NUMBER]($URL)"
change-title-escapes: "\\<*_&"
category-template: "## $TITLE"
no-changes-template: "* No changes"
template: |
  # Update $RESOLVED_VERSION - [Short subtitle]

  <!-- Replace the subtitle and summary before publishing the release. -->
  [1-2 sentence summary of the release.]

  # Changelog

  $CHANGES

  # Support

  If you need help with setup, configuration, or upgrades, join us on [Discord](https://discord.arcadeya.com). If you find a bug or want to suggest a feature, use [GitHub](https://github.com/whereareiam/Identica).

categories:
  - title: "What’s new"
    exclusive: true
    semver-increment: "minor"
    when:
      label: "feature"

  - title: "Enhancements"
    exclusive: true
    semver-increment: "patch"
    when:
      label: "change"

  - title: "Fixes"
    exclusive: true
    semver-increment: "patch"
    when:
      label: "bug"

  - title: "Dependencies"
    exclusive: true
    semver-increment: "patch"
    when:
      label: "dependencies"

  - type: "pre-exclude"
    when:
      label: "skip-changelog"

  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "major"
