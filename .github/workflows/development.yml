name: Development build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.details.outputs.name }}
      version: ${{ steps.details.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project details
        id: details
        run: |
          echo "name=$(grep 'rootProject.name' settings.gradle.kts | awk -F "=" '{print $2}' | tr -d ' \"\n')" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF##*/}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          check-latest: true

      - name: Build
        env:
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_REALM: development
        run: ./gradlew --no-daemon test pluginJars :identica-api:jar publish

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test results
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          find . -name "TEST-*.xml" -type f | while read file; do
            suite=$(grep -oP 'name="\K[^"]+' "$file" | head -1)
            tests=$(grep -oP 'tests="\K[^"]+' "$file" | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' "$file" | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' "$file" | head -1)
            echo "- **$suite**: $tests tests, $failures failures, $errors errors" >> $GITHUB_STEP_SUMMARY
          done

      - name: Create output directory
        run: mkdir output

      - name: Move API
        run: mv identica-api/build/libs/identica-api-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-API-${{ needs.prepare.outputs.version }}.jar

      - name: Move runtime jars
        run: |
          mv build/libs/${{ needs.prepare.outputs.name }}-${{ needs.prepare.outputs.version }}-VELOCITY.jar output/${{ needs.prepare.outputs.name }}-VELOCITY-${{ needs.prepare.outputs.version }}.jar
          mv build/libs/Cracked-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-Cracked-${{ needs.prepare.outputs.version }}.jar
          mv build/libs/Premium-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-Premium-${{ needs.prepare.outputs.version }}.jar

      - name: Archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Build artifacts
          path: output/

  publish-docs:
    needs:
      - prepare
      - build
    if: github.repository == 'whereareiam/Identica' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, identica-docs-k8s]
    permissions:
      contents: read
    env:
      IMAGE: repository.arcadeya.com/whereareiam/identica-docs
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish docs site
        uses: whereareiam/devops/actions/publish-docs-site@dev
        with:
          registry: repository.arcadeya.com
          registry-username: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          image: ${{ env.IMAGE }}
          tags: |
            ${{ env.VERSION }}
            dev-latest
