name: Release build

on:
  release:
    types: [ created ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.details.outputs.name }}
      version: ${{ steps.details.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project details
        id: details
        run: |
          echo "name=$(grep 'rootProject.name' settings.gradle.kts | awk -F "=" '{print $2}' | tr -d ' \"\n')" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build project
        uses: ./.github/actions/gradle-build
        env:
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_REALM: release
        with:
          gradle-command: ./gradlew --no-daemon test build pluginJars publish

      - name: Create output directory
        run: mkdir output

      - name: Move API
        run: mv identica-api/build/libs/identica-api-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-API-${{ needs.prepare.outputs.version }}.jar

      - name: Move runtime jars
        run: |
          mv build/libs/${{ needs.prepare.outputs.name }}-${{ needs.prepare.outputs.version }}-VELOCITY.jar output/${{ needs.prepare.outputs.name }}-VELOCITY-${{ needs.prepare.outputs.version }}.jar
          mv build/libs/Cracked-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-Cracked-${{ needs.prepare.outputs.version }}.jar
          mv build/libs/Premium-${{ needs.prepare.outputs.version }}.jar output/${{ needs.prepare.outputs.name }}-Premium-${{ needs.prepare.outputs.version }}.jar

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/${{ needs.prepare.outputs.name }}-API-${{ needs.prepare.outputs.version }}.jar
            output/${{ needs.prepare.outputs.name }}-VELOCITY-${{ needs.prepare.outputs.version }}.jar
            output/${{ needs.prepare.outputs.name }}-Cracked-${{ needs.prepare.outputs.version }}.jar
            output/${{ needs.prepare.outputs.name }}-Premium-${{ needs.prepare.outputs.version }}.jar

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-distribution-${{ needs.prepare.outputs.version }}
          path: output/

  resolve-distribution:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan-json: ${{ steps.resolve.outputs.plan-json }}
      matrix-json: ${{ steps.resolve.outputs.matrix-json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve distribution plan
        id: resolve
        uses: whereareiam/blockops/actions/publish/resolve-distribution-plan@dev
        with:
          release-tag: ${{ github.event.release.tag_name }}
          release-name: ${{ github.event.release.name }}
          release-body: ${{ github.event.release.body }}
          release-url: ${{ github.event.release.html_url }}

  publish-distribution:
    needs:
      - prepare
      - resolve-distribution
    if: ${{ needs.resolve-distribution.outputs.matrix-json != '[]' }}
    name: Publish ${{ matrix.publication.publication }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        publication: ${{ fromJson(needs.resolve-distribution.outputs.matrix-json) }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-distribution-${{ needs.prepare.outputs.version }}
          path: output

      - name: Publish distribution
        uses: whereareiam/blockops/actions/publish/publish-publication@dev
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          plan-json: ${{ needs.resolve-distribution.outputs.plan-json }}
          artifact-directory: output
          publication: ${{ matrix.publication.publication }}
