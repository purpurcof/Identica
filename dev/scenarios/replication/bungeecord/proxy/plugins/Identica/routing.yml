defaults:
  step:
    target: "auth"
    attempts:
      mode: "RETRY_ONCE"
      maxAttempts: 1
      retryDelay: "0s"
      consumeOnReached: false
      consumeOnExhausted: true
  complete:
    target: "lobby"
    attempts:
      mode: "UNTIL_REACHED"
      maxAttempts: 1
      retryDelay: "1s"
      consumeOnReached: true
      consumeOnExhausted: true
scenarios:
  registration:
    step:
      target: "registration"
  migration:
    step:
      target: "migration"
